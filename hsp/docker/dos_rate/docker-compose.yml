services:
  target:
    image: eclipse-mosquitto:2@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    container_name: hsp-dos-target
    cpus: "0.50"
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  attacker:
    build:
      context: .
      dockerfile: Dockerfile.python
    image: gi-hsp/dos-python:0.1
    container_name: hsp-dos-attacker
    depends_on:
      - target
    cpus: "2.00"
    mem_limit: 512m
    volumes:
      - ./attack:/attack:ro
    working_dir: /attack
    command: ["sleep", "infinity"]

  probe:
    build:
      context: .
      dockerfile: Dockerfile.python
    image: gi-hsp/dos-python:0.1
    container_name: hsp-dos-probe
    depends_on:
      - target
    cpus: "0.50"
    mem_limit: 128m
    volumes:
      - ./probe:/probe:ro
    working_dir: /probe
    command: ["sleep", "infinity"]

  sink:
    build:
      context: .
      dockerfile: Dockerfile.python
    image: gi-hsp/dos-python:0.1
    container_name: hsp-dos-sink
    depends_on:
      - target
    cpus: "0.25"
    mem_limit: 128m
    volumes:
      - ./sink:/sink:ro
    command:
      - python
      - /sink/sink.py
      - --topic
      - hsp/dos/#
      - --qos
      - "1"

  monitor:
    image: nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
    container_name: hsp-dos-monitor
    depends_on:
      - target
    network_mode: "service:target"
    cpus: "0.50"
    mem_limit: 2g
    volumes:
      - ./captures:/captures
    command: ["sleep", "infinity"]

networks:
  default:
    internal: true
