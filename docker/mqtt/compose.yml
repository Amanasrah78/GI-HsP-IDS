services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./log:/mosquitto/log
    networks:
      gi-hsp-net:
        ipv4_address: 172.30.0.10

networks:
  gi-hsp-net:
    external: true
