metric_terminology_correction:
  discovered_during_first_timing_run: true
  performance_informed: false
  numerical_computation_changed: false
  previous_label: auprc
  corrected_label: average_precision
  implementation: sklearn.metrics.average_precision_score
  reason: The implementation computes non-interpolated average precision rather than trapezoidal integration of the precision-recall curve.
