limitations:
- This is a protocol-matched adaptation because the released implementation does not
  define capture-aware window-level evaluation.
- Window-isolated graph construction differs from the released split-wide graph and
  prevents cross-window context.
- The canonical flow schema differs from the NetFlow feature schemas used by the source
  repository.
- The maximum flow-error window score can be sensitive to the number of flows in a
  window.
- Performance must not be presented as a direct reproduction of the source paper's
  reported values.
- The adaptation reconstructs canonical aggregated graph edges rather than the source
  repository's individual NetFlow rows.
pre_training_amendment:
