limitations:
- The experiment evaluates a frozen stratified subset, not all 309 released PCAPs.
- Ground truth is scenario-level rather than exact packet-level or flow-level attribution.
- The activity threshold preferentially retains nonempty, sufficiently populated intervals.
- Three windows from each attack scenario do not estimate within-scenario temporal variability
  across the complete corpus.
- All checkpoints were trained on MQTTset; this is zero-shot transfer without external adaptation.
