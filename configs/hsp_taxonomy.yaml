schema_version: 1
definition:
  name: Host-Space Perturbation
  abbreviation: HsP
  description: 'Attacker-side perturbations applied in host/network/tool space while
    preserving the underlying attack goal. HsP variants are generated by changing
    the realization of an attack rather than modifying extracted IDS feature vectors
    directly.

    '
attack_goals:
  reconnaissance:
    families:
    - nmap
    - nmap_connect
    - python_socket_scan
  authentication:
    families:
    - hydra
    - medusa
    - patator
    - mosquitto_clients
    - mosquitto_invalid_auth
    - paho_invalid_auth
  denial_of_service:
    families:
    - slowloris
  web_fuzzing:
    families:
    - wfuzz
label_contract:
  benign:
    class: benign
    attack_goal: none
    hsp_family: none
  attack:
    class: attack
    attack_goal: required
    hsp_family: required
