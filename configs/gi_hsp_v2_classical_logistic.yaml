schema_version: 1
protocol_id: gi_hsp_v2_logistic_regression_reference
experiment_role: classical_reference_baseline

seed: 0

data:
  dataset: mqttset
  cache_template: results/gi_hsp_v2/classical_cache/mqttset-fold-{fold}-{partition}-identity-5s.npz
  graph_view: identity
  sequence_length: 10
  feature_width: 160

model:
  architecture: logistic_regression
  parameters:
    C: 1.0
    solver: lbfgs
    max_iter: 2000
    tolerance: 0.0001

training:
  use_all_training_windows: true
  class_weighting: balanced_sample_weight
  validation_selects_hyperparameters: false

evaluation:
  threshold: 0.5
  preserve_natural_class_distribution: true

output:
  directory: results/gi_hsp_v2/classical_experiments
