schema_version: 1
protocol_id: gi_hsp_v2_generated_hsp_expanded_multitool
status: frozen_before_capture
dataset: generated_hsp_expanded
evaluation_role: confirmatory_multitool_host_space_perturbation_evaluation
independent_unit: capture
design:
  randomization: blocked_randomization
  randomization_seed: 20260913
  block_count: 10
  captures_per_block: 6
  total_capture_count: 60
  attack_capture_count: 40
  benign_capture_count: 20
  attack_captures_per_family: 10
  benign_controls_per_block: 2
testbed:
  network: gi-hsp-net
  subnet: 172.30.0.0/24
  capture_interface_resolution: br- plus first 12 characters of Docker network ID
  attacker_container: hsp-attacker-expanded
  attacker_ip: 172.30.0.41
  attacker_image: gi-hsp/hsp-attacker-expanded:1.0
  attacker_image_id: sha256:4ab9635cebabb121f64c959b3c6d9b6eb5fe1038e25acbe9ebc56c73b62da3ad
  brokers:
  - container: mqtt-broker
    ip: 172.30.0.10
    port: 1883
    role: unauthenticated_primary
  - container: mqtt-broker-2
    ip: 172.30.0.11
    port: 1883
    role: unauthenticated_secondary
  - container: mqtt-broker-auth
    ip: 172.30.0.12
    port: 1883
    role: authenticated_target
  background_clients:
  - iot-client-1
  - iot-client-2
  - iot-subscriber-1
  authentication:
    username: gi-hsp-user
    invalid_password: expanded-invalid-password
    topic: hsp/expanded/auth
capture:
  duration_seconds: 60
  tcpdump_startup_seconds: 2
  background_warmup_seconds: 10
  attack_duration_seconds: 40
  post_attack_seconds: 10
  inter_capture_cooldown_seconds: 10
  capture_filter: port 1883
  refuse_overwrite: true
  restart_background_clients_per_capture: true
families:
  nmap_connect:
    attack_goal: reconnaissance
    implementation: Nmap TCP connect scan
    tool: nmap
    tool_version: '7.95'
    targets:
    - 172.30.0.10
    - 172.30.0.11
    port: 1883
    duration_seconds: 40
    interval_seconds: 5
    timeout_seconds: 5
  python_socket_scan:
    attack_goal: reconnaissance
    implementation: Python socket.create_connection scanner
    tool: python_socket
    tool_version: Python 3.12.14
    targets:
    - 172.30.0.10
    - 172.30.0.11
    port: 1883
    duration_seconds: 40
    interval_seconds: 5
    timeout_seconds: 3
  mosquitto_invalid_auth:
    attack_goal: authentication
    implementation: Mosquitto client invalid authentication
    tool: mosquitto_pub
    tool_version: 2.0.21
    targets:
    - 172.30.0.12
    port: 1883
    duration_seconds: 40
    interval_seconds: 1
    timeout_seconds: 3
  paho_invalid_auth:
    attack_goal: authentication
    implementation: Paho MQTT invalid CONNECT authentication
    tool: paho-mqtt
    tool_version: 2.1.0
    targets:
    - 172.30.0.12
    port: 1883
    duration_seconds: 40
    interval_seconds: 1
    timeout_seconds: 3
