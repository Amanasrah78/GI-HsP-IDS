limitations:
- This is a protocol-matched adaptation because the released implementation does
  not define window-level temporal classification.
- The common canonical graph contract exposes three aggregated edge features rather
  than each source dataset's original tabular feature set.
- Performance must not be presented as a direct reproduction of the source paper's
  reported numbers.
