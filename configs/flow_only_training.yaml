schema_version: 1

seed: 0

data:
  partition_path: datasets/processed/partitions.json
  sequence_directory: results/processed
  batch_size: 64
  num_workers: 0

model:
  name: flow_only
  flow_dim: 64
  topology_dim: 64
  fusion_dim: 64
  num_classes: 2
  dropout: 0.1

optimizer:
  name: adam
  learning_rate: 0.0001
  weight_decay: 0.0

training:
  epochs: 25
  checkpoint_directory: results/checkpoints/flow_only
