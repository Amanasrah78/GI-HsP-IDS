schema_version: 1
protocol_id: gi_hsp_v2_hist_gradient_boosting_reference
experiment_role: classical_reference_baseline

seed: 0

data:
  dataset: mqttset
  cache_template: results/gi_hsp_v2/classical_cache/mqttset-fold-{fold}-{partition}-identity-5s.npz
  graph_view: identity
  sequence_length: 10
  feature_width: 160

model:
  architecture: hist_gradient_boosting
  parameters:
    learning_rate: 0.1
    max_iter: 200
    max_leaf_nodes: 31
    min_samples_leaf: 20
    l2_regularization: 1.0
    early_stopping: false

training:
  use_all_training_windows: true
  class_weighting: balanced_sample_weight
  validation_selects_hyperparameters: false

evaluation:
  threshold: 0.5
  preserve_natural_class_distribution: true

output:
  directory: results/gi_hsp_v2/classical_experiments
